name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0）'
        required: true
        type: string

permissions:
  contents: write   # 建 release / 上传资产要写权限

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整 tag 历史

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve tag
        id: meta
        # ⚠️ windows-latest 的默认 shell 是 **PowerShell**，不是 bash。
        # 写 bash 语法（if/then/fi）会直接 ParserError。显式声明 shell 更保险。
        #
        # ⚠️ 另：不要用 PowerShell 的 ">> $GITHUB_OUTPUT" 写法——
        #    多行/带特殊字符时容易静默写空。改用 GITHUB_OUTPUT 环境变量的
        #    标准 here-string 追加，一次写一个 key=value，最稳。
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "未能解析出 tag（event=${{ github.event_name }}）"
          }
          $version = $tag -replace '^v', ''
          @"
          tag=$tag
          name=cs-dw $tag
          version=$version
          "@ >> $env:GITHUB_OUTPUT
          Write-Host "resolved tag=$tag version=$version"

      - name: Build
        run: dotnet publish src/NxDrawer.csproj -c Release -o publish -r win-x64 --self-contained false

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # 用 $env:VERSION 而不是 ${{ }} 直接内插：内插发生在 runner 拼装脚本时，
          # 一旦上游输出为空，脚本会静默拼出 "cs-dw--win-x64.zip" 这种坏名字。
          if ([string]::IsNullOrWhiteSpace($env:VERSION)) {
            throw "VERSION 为空，meta 步骤没拿到版本号"
          }
          $zip = "cs-dw-$($env:VERSION)-win-x64.zip"
          # 只打包运行所需：exe + dll + 配置 + 图标资源
          $files = @(
            'publish/nx-drawer.exe',
            'publish/nx-drawer.dll',
            'publish/nx-drawer.deps.json',
            'publish/nx-drawer.runtimeconfig.json',
            'publish/drawer.json',
            'publish/assets'
          ) | Where-Object { Test-Path $_ }
          if ($files.Count -eq 0) { throw "publish 目录里没有可打包文件" }
          Compress-Archive -Path $files -DestinationPath $zip -Force
          Write-Host "packed $zip"
          Get-ChildItem $zip | Format-Table Name, Length

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: true
          body: |
            ## cs-dw ${{ env.VERSION }}

            Windows 边缘抽屉启动器（C# / WPF / .NET 8）。

            - 鼠标贴屏幕边缘 → 半透明抽屉滑出
            - 托盘常驻，右键菜单：显示/隐藏 · 设置… · 退出
            - 配置驱动（`drawer.json`），支持 nx 系列 CLI 子进程统一管理

            ### 使用
            1. 解压 zip
            2. 运行 `nx-drawer.exe`
            3. 首次运行会在同目录生成 `drawer.json`，按需编辑

            运行时需 .NET 8 Desktop Runtime；或自行下载 .NET Desktop Runtime x64。
          files: cs-dw-*-win-x64.zip

      - name: Upload artifact (CI 产物)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: publish/
          retention-days: 30
